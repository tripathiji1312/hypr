# #####################################################################################
# #                            MAIN HYPRLAND CONFIGURATION                            #
# #####################################################################################
#
# This file is the main entry point. It sets up monitors, environment variables,
# and sources all other configuration files from the ~/.config/hypr/hyprland/ folder.
#

################
### MONITORS ###
################
monitor=,preferred,auto,1

#################################################
### CURSOR, THEMES & ENVIRONMENT (CRITICAL!) ###
#################################################
exec-once = xsettingsd # Propagates settings to XWayland apps
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = GTK_THEME,Adwaita:dark
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

#################
### AUTOSOURCE ###
#################
source = ~/.config/hypr/hyprland/decorations.conf
source = ~/.config/hypr/hyprland/autostart.conf
source = ~/.config/hypr/hyprland/keybinds.conf
source = ~/.config/hypr/hyprland/window.conf
source = ~/.config/hypr/hyprland/animation.conf

#############
### INPUT ###
#############
input {
    kb_layout = us
    numlock_by_default = true
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    float_switch_override_focus = 1
}

##############
### LAYOUT ###
##############
dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = false
}

##############
### GESTURES ###
##############
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 400
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 10
}

############
### MISC ###
############
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = 1
    vrr = 1
    focus_on_activate = true
    animate_manual_resizes = false
    enable_swallow = false
}