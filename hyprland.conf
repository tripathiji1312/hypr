# #####################################################################################
# #                            MAIN HYPRLAND CONFIGURATION                            #
# #####################################################################################
#
# This file is the main entry point. It sets up monitors, environment variables,
# and sources all other configuration files from the ~/.config/hypr/hyprland/ folder.
#

################
### MONITORS ###
################
monitor=,preferred,auto,1

#################################################
### CURSOR, THEMES & ENVIRONMENT (CRITICAL!) ###
#################################################
exec-once = xsettingsd # Propagates settings to XWayland apps
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = GTK_THEME,adw-gtk3-dark
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

#################
### AUTOSOURCE ###
#################
source = ~/.config/hypr/hyprland/decorations.conf
source = ~/.config/hypr/hyprland/autostart.conf
source = ~/.config/hypr/hyprland/keybinds.conf
source = ~/.config/hypr/hyprland/window.conf
source = ~/.config/hypr/hyprland/animation.conf

#############
### INPUT ###
#############
input {
    kb_layout = us
    numlock_by_default = true
    follow_mouse = 1  # 0=disabled, 1=always, 2=detached, 3=separate
    
    # Mouse behavior improvements
    mouse_refocus = true  # Only refocus when crossing window boundaries
    focus_on_close = 0  # 0=next window candidate, 1=window under cursor
    
    # Window focus behavior for floating windows
    float_switch_override_focus = 1  # 0=disabled, 1=enabled, 2=also for float-to-float
    
    # Touchpad settings
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        drag_lock = 0  # 0=disabled, 1=timeout, 2=sticky
        tap-and-drag = true
        scroll_factor = 1.0
        middle_button_emulation = false
        clickfinger_behavior = false
    }
    
    # Mouse settings
    sensitivity = 0.2  # -1.0 to 1.0, 0 = no modification
    accel_profile = ""  # Leave empty for libinput default, or "adaptive"/"flat"
    scroll_factor = 1.0
    
    # Keyboard repeat settings
    repeat_rate = 25  # Repeats per second
    repeat_delay = 600  # Milliseconds before repeat starts
}

# === IMPROVEMENT #3: Per-Device Input Configs ===
# Customize input for specific devices (find device names with: hyprctl devices)
