##############
### LAYOUT ###
##############
dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = false
    
    # === IMPROVEMENT #17: Window Move Improvements ===
    # More precise window placement when dragging with mouse
    precise_mouse_move = true
}

##############
### RENDER ###
##############
render {
    # Direct scanout for lower latency in fullscreen games
    direct_scanout = 2  # 0=off, 1=on, 2=auto (on with content type 'game')
    
    # v0.51.1: Auto triple buffering for better FPS on lower-end devices
    new_render_scheduling = true
}

xwayland {
    # Enable XWayland for legacy X11 apps
    enabled = true
    
    # Use nearest neighbor for sharper XWayland rendering (no blur)
    use_nearest_neighbor = true
    
    # Force zero scaling for HiDPI (prevents pixelation)
    force_zero_scaling = false
}

##############
### BINDS ###
##############
binds {
    # Scroll event delay for binds (ms between scroll events)
    scroll_event_delay = 300
    
    # XMonad/Qtile-style workspace switching (switch to current = go to previous)
    workspace_back_and_forth = false
    
    # When changing workspace, center cursor on: 0=workspace, 1=last active window
    workspace_center_on = 0
    
    # Focus finding method: 0=history (recent priority), 1=length (longer edges priority)
    focus_preferred_method = 0
    
    # Allow workspace cycles (endless switching)
    allow_workspace_cycles = false
    
    # Ignore group locks for move/focus dispatchers
    ignore_group_lock = false
    
    # Move focus cycles fullscreen windows instead of changing direction
    movefocus_cycles_fullscreen = false
    
    # Window drag threshold (0 = grab on mousedown)
    drag_threshold = 0
}
gestures {
    # workspace_swipe = true
    # workspace_swipe_fingers = 3
    # New Gesture Configuration
    # Use Hyprland's built-in 1:1 workspace gesture
    gesture = 3, horizontal, workspace
    # workspace_swipe_distance = 400
    # workspace_swipe_invert = true
    # workspace_swipe_min_speed_to_force = 10
}

##############
### CURSOR ###
##############
cursor {
    # Hide cursor after 3 seconds of inactivity (reduces distractions)
    inactive_timeout = 3
    
    # Improved cursor warping behavior (v0.51.1 feature)
    no_warps = false
    persistent_warps = true  # Return cursor to last position in window when refocusing
    
    # Auto-warp cursor to focused window when switching workspaces
    warp_on_change_workspace = 1  # 0=disabled, 1=enabled, 2=force
    
    # Cursor behavior for special workspaces (scratchpads)
    warp_on_toggle_special = 1
    
    # Hide cursor when typing (cleaner experience)
    hide_on_key_press = true
    hide_on_touch = true
    
    # Ensure hyprcursor is enabled (modern cursor theme support)
    enable_hyprcursor = true
    
    # Sync cursor theme with GTK apps
    sync_gsettings_theme = true
    
    # Hardware cursor optimization (auto-disable when tearing)
    no_hardware_cursors = 2  # 0=never, 1=always, 2=auto (disable when tearing)
    
    # VRR optimization: prevent cursor movement from breaking VRR in fullscreen games
    no_break_fs_vrr = 2  # 0=off, 1=on, 2=auto (on with content type 'game')
    min_refresh_rate = 60  # Minimum refresh rate when no_break_fs_vrr is active
}

############
### MISC ###
############
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    
    # Performance: VFR conserves resources, VRR for smooth gaming
    vfr = true
    vrr = 2  # 0=off, 1=always, 2=fullscreen only, 3=fullscreen+game content type
    
    # Focus behavior
    focus_on_activate = true
    mouse_move_focuses_monitor = true  # Mouse movement changes focused monitor
    
    # Animation settings
    animate_manual_resizes = false
    animate_mouse_windowdragging = false  # Disable to prevent weird curves behavior
    
    # Window swallowing (terminal behavior)
    enable_swallow = true
    swallow_regex = ^(kitty|Alacritty|footclient)$
    swallow_exception_regex = ^(wev|nm-connection-editor|pavucontrol)$
    
    # v0.51.1 Features
    new_window_takes_over_fullscreen = 2  # 0=behind, 1=takes over, 2=unfullscreen/unmaxize
    initial_workspace_tracking = 2  # 0=disabled, 1=single-shot, 2=persistent (all children)
    middle_click_paste = true  # Enable primary selection paste
    
    # Performance tuning
    render_unfocused_fps = 15  # Limit FPS for unfocused windows (battery saver)
    
    # Special workspace behavior
    close_special_on_empty = true
    
    # Disable auto-reload if you want to save battery (reload manually with hyprctl reload)
    # disable_autoreload = false
}

# === IMPROVEMENT #9: Advanced Group Management ===
# Configure window grouping behavior (tabbed windows)
group {
    auto_group = true  # New windows automatically join focused unlocked group
    insert_after_current = true  # New windows spawn after current, not at group tail
    focus_removed_window = true  # Focus window that was just moved out of group
    drag_into_group = 2  # 0=disabled, 1=enabled, 2=only when dragging into groupbar
    merge_groups_on_drag = true  # Allow dragging groups into other groups
    merge_groups_on_groupbar = true  # Merge when dragged into groupbar
    
    # Group border colors (already in decorations.conf if needed)
    col.border_active = 0x66ffff00
    col.border_inactive = 0x66777700
    col.border_locked_active = 0x66ff5500
    col.border_locked_inactive = 0x66775500
}

# Scratchpad auto-launch
exec-once = [workspace special:term silent] kitty --class scratchpad
# exec-once = [workspace special:music silent] spotify
# exec-once = [workspace special:files silent] thunar

# Scratchpad window rules
windowrulev2 = float, class:^(scratchpad)$
windowrulev2 = size 80% 80%, class:^(scratchpad)$
windowrulev2 = center, class:^(scratchpad)$
windowrulev2 = opacity 0.95 0.9, class:^(scratchpad)$

# === IMPROVEMENT #5: Workspace Persistence ===
# Keep important workspaces alive even when empty
workspace = 1, persistent:true, name:main
workspace = 2, persistent:true, name:code
workspace = 3, persistent:true, name:browser

# === IMPROVEMENT #8: Monitor-Specific Workspaces ===
# Bind specific workspaces to specific monitors (adjust monitor names as needed)
# Find monitor names with: hyprctl monitors
# Example:
# workspace = 1, monitor:DP-1, default:true
# workspace = 2, monitor:DP-1
# workspace = 3, monitor:DP-1
# workspace = 4, monitor:HDMI-A-1, default:true
# workspace = 5, monitor:HDMI-A-1

