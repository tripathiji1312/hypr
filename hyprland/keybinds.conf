# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Define variables for applications
# It's good practice to define these at the top
$terminal = kitty
$fileManager = thunar

# --- Special Workspace (Scratchpad) ---
# Super + G: Toggle between window groups
bind = $mainMod, G, togglegroup
# Ctrl + Tab: Change the active window group
bind = CTRL, tab, changegroupactive
# Super + S: Toggle the 'magic' special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
# Super + N: Open network manager menu
bind = $mainMod, N, exec, ~/.config/hypr/scripts/wofi_network.sh
# Super + Shift + Return: Launch a terminal for the scratchpad
bind = $mainMod SHIFT, Return, exec, kitty --title scratchpad
# Super + Shift + S: Move the active window to the 'magic' special workspace
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# --- Custom Keybinds ---
# Super + W: Change wallpaper and theme instantly
bind = $mainMod, W, exec, ~/.config/hypr/scripts/change_wallpaper_once.sh

# █▀▀ █░░ █ █▀█ █▀▀ █▀█ ▀█▀
# █▄▄ █▄▄ █ █▀▄ ██▄ █▀▄ ░█░
# Clipboard Manager
# To enable clipboard history, add this to your autostart section:
# exec-once = wl-paste --watch cliphist store
# Super + H: Open clipboard history (wofi)
bind = $mainMod, H, exec, ~/.config/hypr/scripts/wofi_clipboard.sh

# █▀▄▀█ █▀▀ █▀▀ █▀▀ █▄░█ █▀ █▀█ █▀█ ▀█▀
# █░▀░█ ██▄ ██▄ ██▄ █░▀█ ▄█ █▄█ █▀▄ ░█░
# Screenshots
# Make sure the screenshot directory exists: mkdir -p ~/Pictures/Screenshots
# PrintScreen: Open screenshot menu
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh
# Shift + PrintScreen: Capture a region and copy to clipboard
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Region copied to clipboard"
# --- Unused Screenshot Binds ---
# # PrtSc: Capture the entire screen output and copy
# bind = , Print, exec, grim - | wl-copy && notify-send "Screenshot" "Full screen copied to clipboard"
# # Super + PrtSc: Capture the entire screen and save to file
# bind = $mainMod, Print, exec, grim ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png && notify-send "Screenshot" "Full screen saved to file"
# # Super + Shift + PrtSc: Select a region to capture and save to file
# bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png && notify-send "Screenshot" "Region saved to file"

# █▀▀ █▀█ █░█ █▀▀ █▀█ █▀█ █▀▀ █▀▀
# █▄▄ █▀▄ ▀▄▀ ██▄ █▀▄ █▄█ ██▄  shinobi_md
# Applications
# Super + Return: Launch terminal
bind = $mainMod, Return, exec, $terminal
# Super + E: Launch file manager
bind = $mainMod, E, exec, $fileManager
# Super + B: Launch browser
bind = $mainMod, B, exec, zen-browser
# Super + C: Launch VS Code
bind = $mainMod, C, exec, code # Visual Studio Code
# Super key (alone): Open/close wofi launcher
bind = SUPER, SUPER_L, exec, pkill wofi || wofi --show drun

# █▀▄▀█ █▀█ █▀█ █▀▀ █▀▀ █▀█ █▄░█ █▀▀ █▀
# █░▀░█ █▄█ █▀▄ ██▄ █▄▄ █▄█ █░▀█ ██▄ ▄█
# Window Management
# Super + Q: Close active window
bind = $mainMod, Q, killactive,
# Super + V: Toggle floating for active window
bind = $mainMod, V, togglefloating,
# Super + P: Toggle pseudo-tiling for active window
bind = $mainMod, P, pseudo, # dwindle: pseudo-tile the active window
# Super + J: Toggle split direction (horizontal/vertical)
bind = $mainMod, J, togglesplit, # dwindle: change split direction

# Fullscreen Toggles
# Super + Shift + F: Toggle fullscreen with gaps/borders
bind = $mainMod SHIFT, F, fullscreen, 0
# Super + F: Toggle true fullscreen (no gaps/borders)
bind = $mainMod, F, fullscreen, 1

# Window Cycling
# Alt + Tab: Cycle through open windows on the current workspace
bind = ALT, Tab, cyclenext,
# Alt + Shift + Tab: Cycle through open windows on the current workspace (reverse)
bind = ALT SHIFT, Tab, cyclenext, prev

# Resize windows with Super + Ctrl + Arrow Keys
bind = $mainMod CTRL, left, resizeactive, -20 0
bind = $mainMod CTRL, right, resizeactive, 20 0
bind = $mainMod CTRL, up, resizeactive, 0 -20
bind = $mainMod CTRL, down, resizeactive, 0 20

# Move (swap) windows with Super + Shift + Arrow Keys
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

# █▀█ █▀█ █░█ █▀▀ █▀█ █▀▀ █▀
# █▀▀ █▄█ █▄█ ██▄ █▀▄ ██▄ ▄█
# Workspace Control
# Super + [1-9, 0]: Switch to workspace 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Super + Alt + [1-9, 0]: Move active window to a workspace 1-10
bind = $mainMod ALT, 1, movetoworkspace, 1
bind = $mainMod ALT, 2, movetoworkspace, 2
bind = $mainMod ALT, 3, movetoworkspace, 3
bind = $mainMod ALT, 4, movetoworkspace, 4
bind = $mainMod ALT, 5, movetoworkspace, 5
bind = $mainMod ALT, 6, movetoworkspace, 6
bind = $mainMod ALT, 7, movetoworkspace, 7
bind = $mainMod ALT, 8, movetoworkspace, 8
bind = $mainMod ALT, 9, movetoworkspace, 9
bind = $mainMod ALT, 0, movetoworkspace, 10

# Super + Mouse Wheel: Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Workspace Cycling with Tab
# Super + Tab: Cycle to the next workspace
bind = $mainMod, Tab, workspace, e+1
# Super + Shift + Tab: Cycle to the previous workspace
bind = $mainMod SHIFT, Tab, workspace, e-1

# █▀█ █▀█ █▀ █░█ █▀
# █▀▄ █▄█ ▄█ █▄█ ▄█
# Focus and Movement
# Super + Arrow Keys: Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Super + LMB/RMB and dragging: Move/resize windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# █▀▀ █▀█ █▀▀ █░█ █
# █▄▄ █▄█ ██▄ ▀▄▀ █
# System Control
# Super + M: Show power menu
bind = $mainMod, M, exec, ~/.config/hypr/scripts/powermenu.sh
# Super + P: Restart Waybar
bind = $mainMod, P, exec, killall waybar && waybar

# --- Volume and Brightness with OSD Notifications ---
# bindel= ensures the command can be triggered repeatedly by holding the key.
# bindl= is for a single press (like mute).

# Volume control (using function keys)
bindel=, XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/change_volume_brightness.sh volume_up
bindel=, XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/change_volume_brightness.sh volume_down
bindl=, XF86AudioMute, exec, ~/.config/hypr/scripts/change_volume_brightness.sh volume_mute

# Brightness control (using function keys)
bindel=, XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/change_volume_brightness.sh brightness_up
bindel=, XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/change_volume_brightness.sh brightness_down

# Media Player Control (using function keys)
bindl=, XF86AudioNext, exec, playerctl next
bindl=, XF86AudioPause, exec, playerctl play-pause
bindl=, XF86AudioPlay, exec, playerctl play-pause
bindl=, XF86AudioPrev, exec, playerctl previous

# --- Submap for resizing windows ---
# Super + R: Enter resize mode
bind = $mainMod, R, submap, resize

# --- resize submap ---
# This submap is activated by Super + R.
# Press Escape to exit.
submap = resize

# Arrow keys to resize the active window
binde = , left, resizeactive, -20 0
binde = , right, resizeactive, 20 0
binde = , up, resizeactive, 0 -20
binde = , down, resizeactive, 0 20

# Escape key to exit the submap
bind = , escape, submap, reset

# Reset the submap when it's left (e.g., by activating another binding)
submap = reset