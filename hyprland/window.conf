# #######################################################################################
# #                      MODERN & CLEAN HYPRLAND WINDOW RULES (v0.51.1)                #
# #######################################################################################
#
# This file uses clear, logical rules to manage window behavior, focusing on stability
# and preventing common rendering issues like wallpaper bleed in pop-ups.
#
# To find a window's class or title, run `hyprctl clients` in a terminal.
#
# Architecture: Rules are evaluated top-to-bottom (last match wins). Organized by
# function for easy maintenance and troubleshooting.
#
# #######################################################################################

# =======================================================================================
# | I. GLOBAL BASELINE RULES                                                           |
# =======================================================================================
# These rules apply broadly to create a clean aesthetic foundation.
# More specific rules below will override these where needed.

# --- Shadows: Disabled for tiled windows (cleaner, flatter aesthetic)
windowrulev2 = noshadow, floating:0

# --- Dimming: Prevent background dim when floating dialogs are open
windowrulev2 = nodim, floating:1

# --- Floating Windows: Subtle opacity to distinguish from tiled
windowrulev2 = opacity 0.90 0.80, floating:1

# --- Browser Opacity Override: Prevent transparency glitches in browsers
# CRITICAL: Chromium-based browsers can render with unintended transparency
windowrulev2 = opacity 1.0 override, class:^(vivaldi-stable|brave-browser|Google-chrome|firefox|zen-browser)$

# --- Centering: Auto-center all floating windows
windowrulev2 = center, floating:1


# =======================================================================================
# | II. FLOATING WINDOWS & DIALOGS                                                     |
# =======================================================================================
# Specific applications and window types that should float with custom sizing.

# --- File & Dialog Pop-ups (Title-based matching for reliability)
# FIX: Added noblur/noshadow to prevent "thick border" wallpaper bleed on transparent CSD windows
windowrulev2 = float, title:^(Open File|Select a File|Choose wallpaper|Open Folder|Save As|File Upload)(.*)$
windowrulev2 = noblur, title:^(Open File|Select a File|Choose wallpaper|Open Folder|Save As|File Upload)(.*)$
windowrulev2 = noshadow, title:^(Open File|Select a File|Choose wallpaper|Open Folder|Save As|File Upload)(.*)$

windowrulev2 = float, title:^(.*)(wants to save|wants to open)$
windowrulev2 = noblur, title:^(.*)(wants to save|wants to open)$
windowrulev2 = noshadow, title:^(.*)(wants to save|wants to open)$

# --- Windows 11 Style: Settings & Properties
# Ensure "Properties", "Preferences", "Settings" always float and center
windowrulev2 = float, title:^(.*)(Properties|Preferences|Settings)$
windowrulev2 = center, title:^(.*)(Properties|Preferences|Settings)$
windowrulev2 = size 600 450, title:^(.*)(Properties|Preferences|Settings)$
windowrulev2 = noblur, title:^(.*)(Properties|Preferences|Settings)$
windowrulev2 = noshadow, title:^(.*)(Properties|Preferences|Settings)$

# --- System & Utility Dialogs
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Calculator|gnome-system-monitor)$
windowrulev2 = size 45% 45%, class:^(pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Calculator|gnome-system-monitor)$
windowrulev2 = noblur, class:^(pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Calculator|gnome-system-monitor)$
windowrulev2 = noshadow, class:^(pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Calculator|gnome-system-monitor)$

# --- File Manager Context/Progress Windows
windowrulev2 = float, class:^(dolphin|nautilus|thunar)$, title:^(Copying|Moving|Deleting Files|Properties)$
windowrulev2 = size 60% 60%, class:^(dolphin|nautilus|thunar)$, title:^(Copying|Moving|Deleting Files|Properties)$

# --- XDG Desktop Portals: GTK-specific fix (primary file picker)
# CRITICAL: Prevents wallpaper bleed and rendering artifacts
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = noblur, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = noshadow, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = opaque, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = noborder, class:^(xdg-desktop-portal-gtk)$

# Fix for capitalized class names (common issue)
windowrulev2 = float, class:^(Xdg-desktop-portal-gtk)$
windowrulev2 = noblur, class:^(Xdg-desktop-portal-gtk)$
windowrulev2 = noshadow, class:^(Xdg-desktop-portal-gtk)$
windowrulev2 = opaque, class:^(Xdg-desktop-portal-gtk)$
windowrulev2 = noborder, class:^(Xdg-desktop-portal-gtk)$

# --- XDG Desktop Portals: Generic fallback (other implementations)
windowrulev2 = float, class:^(xdg-desktop-portal-.*)$
windowrulev2 = noblur, class:^(xdg-desktop-portal-.*)$
windowrulev2 = noshadow, class:^(xdg-desktop-portal-.*)$
windowrulev2 = noborder, class:^(xdg-desktop-portal-.*)$

# --- Authentication Dialogs: Keep focused (security)
windowrulev2 = float, class:^(pinentry-.*)$
windowrulev2 = stayfocused, class:^(pinentry-.*)$

# --- IDE/Editor Pop-ups (VS Code, Cursor)
# Floats settings/dialogs but not editor windows (which have file names in title)
windowrulev2 = float, class:^(Code|cursor)$, title:^(?!.*(—|\[)).*$
windowrulev2 = size 70% 80%, class:^(Code|cursor)$, title:^(?!.*(—|\[)).*$

# --- JetBrains IDEs (PyCharm, IntelliJ, WebStorm, etc.) - XWayland Apps
# CRITICAL FIX: Remove ALL compositor effects to fix popup positioning bug.
# JetBrains popups appear in center instead of correct position due to XWayland issues.
# Solution: Make Hyprland completely ignore these windows for effects.
windowrulev2 = noblur, class:^(jetbrains-.*)$
windowrulev2 = noshadow, class:^(jetbrains-.*)$
windowrulev2 = nodim, class:^(jetbrains-.*)$
windowrulev2 = noanim, class:^(jetbrains-.*)$
windowrulev2 = norounding, class:^(jetbrains-.*)$
windowrulev2 = noborder, class:^(jetbrains-.*)$
windowrulev2 = opaque, class:^(jetbrains-.*)$
windowrulev2 = forcergbx, class:^(jetbrains-.*)$
windowrulev2 = suppressevent activate, class:^(jetbrains-.*)$
windowrulev2 = suppressevent fullscreen, class:^(jetbrains-.*)$


# =======================================================================================
# | III. PICTURE-IN-PICTURE (PiP) - UNIVERSAL FIX                                      |
# =======================================================================================
# Clean, borderless PiP windows for all browsers and media apps.
# Works with: Vivaldi, Brave, Chrome, Firefox, MPV, VLC, etc.

# --- Universal PiP Pattern (case-insensitive)
windowrulev2 = float, title:^([Pp]icture-in-[Pp]icture)$
windowrulev2 = pin, title:^([Pp]icture-in-[Pp]icture)$
windowrulev2 = size 25% 25%, title:^([Pp]icture-in-[Pp]icture)$
windowrulev2 = move 74% 73%, title:^([Pp]icture-in-[Pp]icture)$
windowrulev2 = noborder, title:^([Pp]icture-in-[Pp]icture)$
windowrulev2 = rounding 0, title:^([Pp]icture-in-[Pp]icture)$
windowrulev2 = noshadow, title:^([Pp]icture-in-[Pp]icture)$
windowrulev2 = noblur, title:^([Pp]icture-in-[Pp]icture)$
windowrulev2 = noanim, title:^([Pp]icture-in-[Pp]icture)$
windowrulev2 = keepaspectratio, title:^([Pp]icture-in-[Pp]icture)$
windowrulev2 = nodim, title:^([Pp]icture-in-[Pp]icture)$

# --- Google Meet PiP (pattern: "Meet - xxx-xxxx-xxx")
# Special handling for Chromium's Meet PiP rendering pipeline
windowrulev2 = float, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = pin, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = size 25% 25%, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = move 74% 73%, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = noborder, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = rounding 0, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = noshadow, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = noblur, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = opacity 1.0 override, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = keepaspectratio, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = noanim, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$


# =======================================================================================
# | IV. SPECIFIC APPLICATION BEHAVIOR                                                  |
# =======================================================================================
# Rules for specific application behaviors and optimizations.

# --- Terminal: Kitty (subtle transparency)
windowrulev2 = opacity 0.95 0.85, class:^(kitty)$

# --- Scratchpad Terminal (unified approach using class only)
# Launch with: kitty --class scratchpad
windowrulev2 = workspace special:magic, class:^(scratchpad)$
windowrulev2 = float, class:^(scratchpad)$
windowrulev2 = size 60% 60%, class:^(scratchpad)$
windowrulev2 = center, class:^(scratchpad)$

# --- Media & Image Viewers
windowrulev2 = float, class:^(gwenview|loupe|sxiv|imv|feh|eog|mpv|vlc)$
windowrulev2 = center, class:^(gwenview|loupe|sxiv|imv|feh|eog|mpv|vlc)$
windowrulev2 = keepaspectratio, class:^(gwenview|loupe|sxiv|imv|feh|eog|mpv|vlc|celluloid)$
windowrulev2 = idleinhibit focus, class:^(mpv|vlc|celluloid)$  # Prevent sleep during playback


# =======================================================================================
# | V. SMART GAPS - NO GAPS/BORDERS WHEN ONLY ONE WINDOW                               |
# =======================================================================================
# Creates a cleaner experience when focusing on a single window.
# Note: The 's[false]' excludes special workspaces from this behavior.

# --- Workspace-level: Remove gaps and disable borders/rounding
workspace = w[tv1]s[false], gapsout:0, gapsin:0, border:false, rounding:false
workspace = f[1]s[false], gapsout:0, gapsin:0, border:false, rounding:false

# --- Window-level: Remove borders and rounding for tiled windows
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]s[false]
windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]s[false]
windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]s[false]
windowrulev2 = rounding 0, floating:0, onworkspace:f[1]s[false]


# =======================================================================================
# | VI. LAYER RULES - BARS, NOTIFICATIONS, LAUNCHERS                                   |
# =======================================================================================
# Control blur and behavior for overlay surfaces (status bars, notifications, etc.)
# Find layer namespaces with: hyprctl layers

# --- Status Bar (Waybar)
layerrule = blur, waybar
layerrule = blur, gtk-layer-shell
layerrule = ignorezero, waybar  # Ignore fully transparent pixels in blur
layerrule = xray 1, waybar      # Modern blur-through effect

# --- Notification Daemon
layerrule = blur, notifications
layerrule = ignorealpha 0.3, notifications  # Don't blur if opacity < 0.3

# --- App Launchers
layerrule = blur, wofi
layerrule = blur, rofi
layerrule = ignorealpha 0.5, wofi
layerrule = animation popin, wofi
layerrule = animation popin, rofi

# --- Lock Screen
layerrule = blur, hyprlock
layerrule = noanim, hyprlock
layerrule = abovelock, hyprlock

# --- Quickshell Components (Enhanced Blur)
# Blur specific QuickShell panels (more precise control than global popups blur)
layerrule = blur, quickshell-controlcenter
layerrule = blur, quickshell-bar
layerrule = blur, quickshell-notifications
layerrule = ignorealpha 0.6, quickshell-controlcenter  # Don't blur if opacity < 60%
layerrule = ignorealpha 0.6, quickshell-bar
layerrule = ignorealpha 0.6, quickshell-notifications
# Generic fallback for any QuickShell layer
layerrule = noanim, ^(quickshell.*)$
