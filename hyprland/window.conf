# #######################################################################################
# #               REFINED & PERSONALIZED HYPRLAND WINDOW RULES (v2)                     #
# #######################################################################################
#
# Philosophy: This file uses precise and stable logic to prevent buggy floating windows.
# This version includes fixes for GTK desktop portal rendering issues.
#
# To find a window's class or title, run `hyprctl clients` in a terminal.
#
# #######################################################################################


# =======================================================================================
# | I. FLOATING WINDOWS & DIALOGS                                                       |
# =======================================================================================
# These rules handle pop-ups, dialogs, and specific apps that should always float.
# They are intentionally specific to avoid catching the wrong windows.
# ---------------------------------------------------------------------------------------

# --- File & Dialog Pop-ups (The reliable way)
windowrulev2 = float, title:^(Open File|Select a File|Choose wallpaper|Open Folder|Save As|File Upload)(.*)$
windowrulev2 = float, title:^(.*)(wants to save|wants to open)$
windowrulev2 = center, floating:1 # Center ANY window that is made to float

# --- File Manager Dialogs (Dolphin, Nautilus, Thunar)
windowrulev2 = float, class:^(dolphin|nautilus|thunar)$, title:^(Copying|Moving|Deleting Files|Properties)$
windowrulev2 = size 60% 60%, class:^(dolphin|nautilus|thunar)$, title:^(Copying|Moving|Deleting Files|Properties)$

# --- System Utilities (pavucontrol, blueman, nm-connection-editor)
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = size 45% 45%, class:^(pavucontrol|blueman-manager|nm-connection-editor)$

# --- Portals & Authentication
windowrulev2 = float, class:^(xdg-desktop-portal-.*)$
windowrulev2 = stayfocused, class:^(pinentry-.*)$ # Keep password prompts focused

# FIX for GTK portal visual glitches (double shadows and borders)
windowrulev2 = noblur, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = noshadow, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = opaque, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = noborder, class:^(xdg-desktop-portal-gtk)$


# --- IDE/Editor Pop-ups (VS Code, Cursor, JetBrains)
# Floats splash screens, settings, and dialogs without a file open in the title
windowrulev2 = float, class:^(Code|cursor|jetbrains-.*)$, title:^(?!.*(—|\[)).*$
windowrulev2 = size 70% 80%, class:^(Code|cursor|jetbrains-.*)$, title:^(?!.*(—|\[)).*$


# =======================================================================================
# | II. SPECIFIC APPLICATION BEHAVIOR                                                   |
# =======================================================================================
# Rules for how specific, non-floating applications should behave.
# ---------------------------------------------------------------------------------------

# --- Picture-in-Picture (PiP) for Brave, Chrome, Firefox, etc.
windowrulev2 = float, title:^([Pp]icture-in-[Pp]icture)$
windowrulev2 = pin, title:^([Pp]icture-in-[Pp]icture)$
windowrulev2 = size 25%, title:^([Pp]icture-in-[Pp]icture)$
windowrulev2 = move 73% 72%, title:^([Pp]icture-in-[Pp]icture)$
windowrulev2 = noborder, title:^([Pp]icture-in-[Pp]icture)$
windowrulev2 = noshadow, title:^([Pp]icture-in-[Pp]icture)$

# --- Terminal: Kitty
windowrulev2 = opacity 0.95 0.85, class:^(kitty)$

# --- Scratchpad Terminal (for Kitty)
# To use, launch kitty with `kitty --title scratchpad`
windowrulev2 = workspace special:magic, class:^(kitty)$, title:^(scratchpad)$
windowrulev2 = float, class:^(kitty)$, title:^(scratchpad)$
windowrulev2 = size 60% 60%, class:^(kitty)$, title:^(scratchpad)$
windowrulev2 = center, class:^(kitty)$, title:^(scratchpad)$

# --- Media & Image Viewers (Gwenview and others)
windowrulev2 = float, class:^(gwenview|loupe|sxiv|imv|feh|eog)$
windowrulev2 = center, class:^(gwenview|loupe|sxiv|imv|feh|eog)$
windowrulev2 = keepaspectratio, class:^(gwenview|loupe|sxiv|imv|feh|eog)$
windowrulev2 = idleinhibit focus, class:^(mpv|vlc|celluloid)$ # Prevent sleep when watching media

# --- Shadows
# Disable shadows for tiled (non-floating) windows for a cleaner look.
windowrulev2 = noshadow, floating:0

# --- Workspace Rules
# Smart gaps: No gaps when only one tiled window is on a workspace
workspace = w[tv1]s[false], gapsout:0, gapsin:0, border:false, rounding:false
workspace = f[1]s[false], gapsout:0, gapsin:0, border:false, rounding:false

# Vivaldi dropdown menus
windowrulev2 = noblur, class:^(vivaldi-stable)$, title:^()$
windowrulev2 = noborder, class:^(vivaldi-stable)$, title:^()$
windowrulev2 = noshadow, class:^(vivaldi-stable)$, title:^()$
windowrulev2 = noanim, class:^(vivaldi-stable)$, title:^()$

# Slack/Teams popups
windowrulev2 = noblur, class:^(Slack|teams-for-linux)$, title:^()$
windowrulev2 = noborder, class:^(Slack|teams-for-linux)$, title:^()$

