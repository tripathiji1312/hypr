# #######################################################################################
# #               THE DEFINITIVE HYPRLAND WINDOW & WORKSPACE RULES                      #
# #######################################################################################
#
# Philosphy: Be specific first, general last.
# This file is structured in order of precedence. Rules at the top will be
# processed first and are intended for specific, high-priority cases. General
# catch-all rules are at the bottom.
#
# To find a window's class or title, run `hyprctl clients` in a terminal.
#
# #######################################################################################


# =======================================================================================
# | I. HIGH-PRIORITY & SPECIFIC OVERRIDES                                               |
# =======================================================================================
# These rules MUST come first to ensure they are not overridden by general rules.
# They handle Picture-in-Picture, password prompts, and other special cases.
# ---------------------------------------------------------------------------------------

# --- Picture-in-Picture (PiP)
# Targets Google Meet, YouTube, and any other browser-based PiP.
windowrulev2 = float, class:^(brave-browser|google-chrome-stable|firefox)$, title:^(Meet - .*|Picture-in-Picture)$
windowrulev2 = pin, class:^(brave-browser|google-chrome-stable|firefox)$, title:^(Meet - .*|Picture-in-Picture)$
windowrulev2 = move 100%-w-20 100%-h-20, class:^(brave-browser|google-chrome-stable|firefox)$, title:^(Meet - .*|Picture-in-Picture)$
windowrulev2 = size 350 250, class:^(brave-browser|google-chrome-stable|firefox)$, title:^(Meet - .*|Picture-in-Picture)$
windowrulev2 = noborder, class:^(brave-browser|google-chrome-stable|firefox)$, title:^(Meet - .*|Picture-in-Picture)$
windowrulev2 = noshadow, class:^(brave-browser|google-chrome-stable|firefox)$, title:^(Meet - .*|Picture-in-Picture)$
windowrulev2 = forcergbx, class:^(brave-browser|google-chrome-stable|firefox)$, title:^(Meet - .*|Picture-in-Picture)$

# --- Critical System Windows
windowrulev2 = stayfocused, class:^(pinentry-.*)$ # Keep password prompts focused
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor)$ # Sound/BT/Network


# =======================================================================================
# | II. APPLICATION BEHAVIOR RULES                                                      |
# =======================================================================================
# Rules tailored for specific application categories for a native feel.
# ---------------------------------------------------------------------------------------

# --- Terminals
windowrulev2 = opacity 0.95 0.85, class:^(kitty|Alacritty|wezterm)$
windowrulev2 = float, class:^(kitty|Alacritty|wezterm)$, title:^(scratchpad)$
windowrulev2 = size 50% 50%, class:^(kitty|Alacritty|wezterm)$, title:^(scratchpad)$
windowrulev2 = center, class:^(kitty|Alacritty|wezterm)$, title:^(scratchpad)$

# --- Scratchpad Terminal Rules ---
# This rule moves any terminal with the title "scratchpad" to the special 'magic' workspace
windowrulev2 = workspace special:magic, class:^(kitty|Alacritty|wezterm)$, title:^(scratchpad)$
# This rule makes it float
windowrulev2 = float, class:^(kitty|Alacritty|wezterm)$, title:^(scratchpad)$
# This rule sets its size
windowrulev2 = size 60% 60%, class:^(kitty|Alacritty|wezterm)$, title:^(scratchpad)$
# This rule centers it
windowrulev2 = center, class:^(kitty|Alacritty|wezterm)$, title:^(scratchpad)$

# --- File Managers
windowrulev2 = float, class:^(thunar|dolphin|nautilus)$, title:^(Copying|Moving|Deleting Files|Properties)$
windowrulev2 = size 60% 60%, class:^(thunar|dolphin|nautilus)$, title:^(Copying|Moving|Deleting Files|Properties)$
windowrulev2 = center, class:^(thunar|dolphin|nautilus)$, title:^(Copying|Moving|Deleting Files|Properties)$

# --- Gaming & Launchers
windowrulev2 = fullscreen, class:^(steam_app_.*)$
windowrulev2 = fullscreen, title:([Gg]ame)$
windowrulev2 = idleinhibit fullscreen, class:.* # Inhibit idle for any fullscreen app
windowrulev2 = noblur, class:^.*(steam|lutris|heroic|steam_app_).*$
windowrulev2 = float, class:^(steam|lutris|heroic)$, title:^((?!^Steam$).*)$ # Float Steam friends list/dialogs

# --- IDEs & Text Editors (VSCode, JetBrains)
windowrulev2 = float, class:^(VSCodium|code-oss|jetbrains-.*)$, title:^(?!.*(—|\[)).*$ # Float windows without a file open
windowrulev2 = size 70% 80%, class:^(VSCodium|code-oss|jetbrains-.*)$, title:^(?!.*(—|\[)).*$
windowrulev2 = center, class:^(VSCodium|code-oss|jetbrains-.*)$, title:^(?!.*(—|\[)).*$

# --- Media & Image Viewers
windowrulev2 = float, class:^(loupe|sxiv|imv|feh|eog|gwenview)$
windowrulev2 = center, class:^(loupe|sxiv|imv|feh|eog|gwenview)$
windowrulev2 = keepaspectratio, class:^(loupe|sxiv|imv|feh|eog|gwenview)$
windowrulev2 = idleinhibit focus, class:^(mpv|vlc|celluloid)$


# =======================================================================================
# | III. GENERAL FLOATING & DIALOG RULES (CATCH-ALLS)                                   |
# =======================================================================================
# These are broad rules for common dialogs. They MUST be last to avoid overriding
# the specific application rules defined above.
# ---------------------------------------------------------------------------------------

# --- Generic Dialogs and Pop-ups
windowrulev2 = float, title:(^(Open|Save|Select|Choose|Create|Export|Import|Print|Find|Replace|Properties|Preferences|Settings|Options|About|Help)(.*)$)
windowrulev2 = float, title:(^(.*)(Authentication|Login|Sign In|Password|Keyring|Credential)(.*)$)
windowrulev2 = float, title:(^(.*)(Error|Warning|Alert|Confirmation|Question)(.*)$)
windowrulev2 = float, class:^(xdg-desktop-portal-.*)$

# --- Size and Center the above general floating windows for consistency
windowrulev2 = size 60% 70%, floating:1
windowrulev2 = center, floating:1


# =======================================================================================
# | IV. WORKSPACE & LAYOUT RULES                                                        |
# =======================================================================================
# Rules for how workspaces behave, including the "smart gaps" feature.
# ---------------------------------------------------------------------------------------

# --- Smart Gaps: No gaps when only one tiled window is on a workspace
workspace = w[tv1]s[false], gapsout:0, gapsin:0
workspace = f[1]s[false], gapsout:0, gapsin:0

# --- Smart Borders: No border or rounding when only one tiled window is on a workspace
windowrule = bordersize 0, floating:0, onworkspace:w[tv1]s[false]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]s[false]
windowrule = bordersize 0, floating:0, onworkspace:f[1]s[false]
windowrule = rounding 0, floating:0, onworkspace:f[1]s[false]