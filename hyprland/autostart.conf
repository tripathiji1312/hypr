# #####################################################################################
# #                                   AUTOSTART                                       #
# #####################################################################################
#
# Programs and services to launch when Hyprland starts.
#

# --- Core System Services ---
# Starts the authentication agent for password prompts (e.g., for sudo in GUI apps)
exec-once = /usr/lib/polkit-kde-authentication-agent-1
# Updates environment for systemd services
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# --- Your UI and Apps ---
exec-once = quickshell
exec-once = hypridle
# exec-once = dunst
exec-once = nm-applet --indicator

# --- Clipboard Manager ---
exec-once = wl-paste --watch cliphist store
exec-once = /usr/lib/pam_kwallet_init
# Starts the Hyprland-specific portal
exec-once = /usr/lib/xdg-desktop-portal-hyprland

# --- Scripts ---
exec-once = ~/.config/hypr/scripts/startup_theme.sh
exec-once = ~/.config/dunst/battery_notification.sh

# --- Cursor Theme Fix (applied after theme initialization) ---
# This ensures cursor theme is properly set even after system updates
exec-once = sleep 2 && hyprctl setcursor Bibata-Modern-Ice 24