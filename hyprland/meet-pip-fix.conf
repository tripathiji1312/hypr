# =======================================================================================
# | GOOGLE MEET PIP FIX - Wallpaper Bleed Prevention                                 |
# =======================================================================================
#
# PROBLEM: Google Meet PiP windows show wallpaper bleeding around borders/edges
# CAUSE: Meet PiP windows have semi-transparent regions that show compositor background
# SOLUTION: Force full opacity on Meet-specific windows only
#
# This file ONLY targets Google Meet PiP windows - does NOT affect other popups/menus
# =======================================================================================

# Google Meet PiP Detection Pattern: "Meet - xxx-xxxx-xxx" (meeting code format)
# Example titles: "Meet - abc-defg-hij", "Meet - xyz-abcd-efg"

# Vivaldi - Meet PiP
windowrulev2 = opacity 1.0 override, class:^(vivaldi-stable)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = noshadow, class:^(vivaldi-stable)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$

# Brave - Meet PiP
windowrulev2 = opacity 1.0 override, class:^(brave-browser)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = noshadow, class:^(brave-browser)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$

# Chrome - Meet PiP
windowrulev2 = opacity 1.0 override, class:^(Google-chrome)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = noshadow, class:^(Google-chrome)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$

# Firefox - Meet PiP
windowrulev2 = opacity 1.0 override, class:^(firefox)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = noshadow, class:^(firefox)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$

# Zen Browser - Meet PiP
windowrulev2 = opacity 1.0 override, class:^(zen-alpha|zen)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = noshadow, class:^(zen-alpha|zen)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$

# =======================================================================================
# | NOTES                                                                              |
# =======================================================================================
# - opacity 1.0 override: Forces 100% opacity to hide wallpaper bleed
# - noshadow: Prevents shadow rendering artifacts around transparent edges
# - RegEx pattern matches Meet's room code format (e.g. "abc-defg-hij")
# - Does NOT affect right-click menus, dropdowns, or other browser popups
