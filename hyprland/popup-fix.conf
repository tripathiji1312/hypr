# #####################################################################################
# #                    POPUP & CONTEXT MENU FIX (WALLPAPER BLEED)                    #
# #####################################################################################
#
# This file fixes the critical issue where:
# 1. Right-click context menus show wallpaper bleeding through
# 2. Google Meet popups show wallpaper visible from sides
# 3. All popups look forced, ugly, and unpleasant
#
# ROOT CAUSE: Popups are semi-transparent, allowing wallpaper to show through
# SOLUTION: Force full opacity + disable all visual effects on popups
#
# #####################################################################################

# =======================================================================================
# | CRITICAL FIX: Context Menus & Right-Click Menus                                   |
# =======================================================================================
# These catch all right-click context menus (empty title = popup/menu)


# #####################################################################################
# #                    GOOGLE MEET PIP & POPUP FIX (WALLPAPER LEAK)                  #
# #####################################################################################
#
# This file ONLY fixes the wallpaper leaking around Google Meet PiP windows.
# It does NOT touch right-click menus or other popups (those were working fine).
#
# ROOT CAUSE: Meet PiP windows have transparency that shows wallpaper around edges
# SOLUTION: Force opacity on Meet PiP windows specifically
#
# #####################################################################################

# =======================================================================================
# | GOOGLE MEET PIP WINDOWS - Prevent wallpaper leak                                 |
# =======================================================================================

# Meet PiP in Vivaldi - Force full opacity to prevent wallpaper bleed
windowrulev2 = opacity 1.0 override, class:^(vivaldi-stable)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = noshadow, class:^(vivaldi-stable)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$

# Meet PiP in Brave
windowrulev2 = opacity 1.0 override, class:^(brave-browser)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = noshadow, class:^(brave-browser)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$

# Meet PiP in Chrome
windowrulev2 = opacity 1.0 override, class:^(Google-chrome)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = noshadow, class:^(Google-chrome)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$

# Meet PiP in Zen
windowrulev2 = opacity 1.0 override, class:^(zen-alpha|zen)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$
windowrulev2 = noshadow, class:^(zen-alpha|zen)$, title:^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$


# =======================================================================================
# | NOTES                                                                              |
# =======================================================================================
# Right-click menus and browser popups work fine with default settings.
# They are subsurfaces rendered by the browser, not separate windows.
# The xray blur setting in decorations.conf prevents wallpaper bleed on them.
windowrulev2 = noblur, class:^(firefox)$, title:^$
windowrulev2 = noshadow, class:^(firefox)$, title:^$
windowrulev2 = noanim, class:^(firefox)$, title:^$


# =======================================================================================
# | GOOGLE MEET SPECIFIC FIXES                                                        |
# =======================================================================================
# Google Meet popups (notifications, permission requests, etc.)


# Meet popups in Vivaldi
windowrulev2 = opacity 1.0 override, class:^(vivaldi-stable)$, title:^(.*meet.google.com.*)$, floating:1
windowrulev2 = noblur, class:^(vivaldi-stable)$, title:^(.*meet.google.com.*)$, floating:1
windowrulev2 = noshadow, class:^(vivaldi-stable)$, title:^(.*meet.google.com.*)$, floating:1


# Meet popups in Brave
windowrulev2 = opacity 1.0 override, class:^(brave-browser)$, title:^(.*meet.google.com.*)$, floating:1
windowrulev2 = noblur, class:^(brave-browser)$, title:^(.*meet.google.com.*)$, floating:1
windowrulev2 = noshadow, class:^(brave-browser)$, title:^(.*meet.google.com.*)$, floating:1


# Meet popups in Chrome
windowrulev2 = opacity 1.0 override, class:^(Google-chrome)$, title:^(.*meet.google.com.*)$, floating:1
windowrulev2 = noblur, class:^(Google-chrome)$, title:^(.*meet.google.com.*)$, floating:1
windowrulev2 = noshadow, class:^(Google-chrome)$, title:^(.*meet.google.com.*)$, floating:1


# =======================================================================================
# | XWayland POPUP FIXES (Discord, Slack, Electron Apps)                             |
# =======================================================================================

# XWayland apps often have transparency issues
windowrulev2 = opacity 1.0 override, xwayland:1, floating:1, title:^$
windowrulev2 = noblur, xwayland:1, floating:1, title:^$
windowrulev2 = noshadow, xwayland:1, floating:1, title:^$
windowrulev2 = noanim, xwayland:1, floating:1, title:^$


# =======================================================================================
# | GTK/QT APPLICATION POPUPS                                                         |
# =======================================================================================
# File pickers, settings dialogs, tooltips


# Thunar popups
windowrulev2 = opacity 1.0 override, class:^(thunar)$, floating:1, title:^$


# VS Code popups
windowrulev2 = opacity 1.0 override, class:^(Code|code)$, floating:1, title:^$


# Kitty popups (if any)
windowrulev2 = opacity 1.0 override, class:^(kitty)$, floating:1, title:^$


# =======================================================================================
# | LAYER RULES FOR BARS & NOTIFICATIONS                                             |
# =======================================================================================
# Note: There's no "noblur" for layerrule - just don't enable blur, or use ignorealpha
# We'll keep this section minimal to avoid issues


# =======================================================================================
# | TESTING & DEBUGGING                                                               |
# =======================================================================================
# To test if this fixes your issue:
# 1. Reload Hyprland: hyprctl reload
# 2. Right-click anywhere - menu should be SOLID, no wallpaper bleed
# 3. Open Google Meet - popups should be SOLID, no wallpaper visible
# 4. If still issues, run: hyprctl clients | grep -A10 "class\|title"
#    to identify the exact window class/title causing problems
