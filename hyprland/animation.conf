# #####################################################################################
# #                                  ANIMATIONS                                       #
# #####################################################################################
#
# Professional animation configuration for Hyprland 0.51.1
# Provides smooth, expressive animations optimized for 60fps
#

animations {
    enabled = true
    
    # v0.51.1: Enable workspace wraparound for seamless cycling
    workspace_wraparound = true
    
    # ===============================================================================
    # | BEZIER CURVES - Fluent Motion (Windows 11)                                 |
    # ===============================================================================
    
    # Fluent Design Standard Easing
    # "Decel" = fast start, slow end (used for entering)
    # "Accel" = slow start, fast end (used for exiting)
    bezier = fluent_decel, 0.1, 1, 0, 1
    bezier = fluent_accel, 0.1, 0, 0.1, 0
    
    # Legacy/Helper curves
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = linear, 0, 0, 1, 1
    
    # ===============================================================================
    # | WINDOW ANIMATIONS                                                          |
    # ===============================================================================
    
    # Windows 11 Style: Slide up + Fade in with slight overshoot
    animation = windowsIn, 1, 3, fluent_decel, slide
    animation = windowsOut, 1, 3, fluent_accel, slide
    animation = windowsMove, 1, 3, fluent_decel, slide
    
    # ===============================================================================
    # | BORDER ANIMATIONS                                                          |
    # ===============================================================================
    
    animation = border, 1, 10, linear
    animation = borderangle, 1, 100, linear, once
    
    # ===============================================================================
    # | FADE ANIMATIONS                                                            |
    # ===============================================================================
    
    animation = fadeIn, 1, 3, fluent_decel
    animation = fadeOut, 1, 3, fluent_accel
    animation = fadeSwitch, 1, 3, fluent_decel
    animation = fadeShadow, 1, 3, fluent_decel
    animation = fadeDim, 1, 3, fluent_decel
    
    # ===============================================================================
    # | WORKSPACE ANIMATIONS                                                       |
    # ===============================================================================
    
    # Smooth sliding for workspaces (matches 1:1 gesture feel)
    animation = workspaces, 1, 4, fluent_decel, slide
    animation = workspacesIn, 1, 4, fluent_decel, slide
    animation = workspacesOut, 1, 4, fluent_accel, slide
    
    # Special workspace (scratchpad) - Vertical slide like Windows Task View
    animation = specialWorkspace, 1, 3, fluent_decel, slidevert
    
    # ===============================================================================
    # | LAYER ANIMATIONS (UI elements)                                             |
    # ===============================================================================
    
    # Menus and bars should fade/slide quickly
    animation = layers, 1, 2, fluent_decel, slide
    animation = layersIn, 1, 2, fluent_decel, slide
    animation = layersOut, 1, 2, fluent_accel, slide
    
    animation = fadeLayersIn, 1, 2, fluent_decel
    animation = fadeLayersOut, 1, 2, fluent_accel
    
    # ===============================================================================
    # | EXTRA ANIMATIONS                                                           |
    # ===============================================================================
    
    animation = zoomFactor, 1, 4, fluent_decel
}