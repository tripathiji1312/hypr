# #####################################################################################
# #                                  ANIMATIONS                                       #
# #####################################################################################
#
# Professional animation configuration for Hyprland 0.51.1
# Provides smooth, expressive animations optimized for 60fps
#

animations {
    enabled = true
    
    # ===============================================================================
    # | BEZIER CURVES - Custom easing functions                                    |
    # ===============================================================================
    
    # Main curves
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = linear, 0, 0, 1, 1
    
    # Smooth curves
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    
    # Special effects
    bezier = bounce, 1, 1.6, 0.1, 0.85
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = menu, 0.1, 1, 0, 1
    
    # ===============================================================================
    # | WINDOW ANIMATIONS                                                          |
    # ===============================================================================
    
    # Window opening - Popin effect with slight overshoot
    animation = windowsIn, 1, 5, winIn, popin 80%
    
    # Window closing - Smooth fade out with popin
    animation = windowsOut, 1, 4, winOut, popin 80%
    
    # Window movement/dragging/resizing - Smooth slide
    animation = windowsMove, 1, 4, wind, slide
    
    # ===============================================================================
    # | BORDER ANIMATIONS                                                          |
    # ===============================================================================
    
    # Border color changes
    animation = border, 1, 10, linear
    
    # Border gradient angle rotation (WARNING: impacts battery)
    animation = borderangle, 1, 100, linear, loop
    
    # ===============================================================================
    # | FADE ANIMATIONS                                                            |
    # ===============================================================================
    
    # Window fade in/out
    animation = fadeIn, 1, 8, smoothIn
    animation = fadeOut, 1, 8, smoothOut
    
    # Active window switch fade
    animation = fadeSwitch, 1, 8, smoothIn
    
    # Shadow fade
    animation = fadeShadow, 1, 8, smoothOut
    
    # Dimming inactive windows
    animation = fadeDim, 1, 8, smoothOut
    
    # Layer fades (Waybar, notifications)
    animation = fadeLayers, 1, 5, smoothOut
    animation = fadeLayersIn, 1, 5, smoothIn
    animation = fadeLayersOut, 1, 5, smoothOut
    
    # Popup fades (context menus, tooltips)
    animation = fadePopups, 1, 4, md3_decel
    animation = fadePopupsIn, 1, 4, md3_decel
    animation = fadePopupsOut, 1, 4, md3_accel
    
    # DPMS (screen on/off) fade
    animation = fadeDpms, 1, 6, smoothOut
    
    # ===============================================================================
    # | WORKSPACE ANIMATIONS                                                       |
    # ===============================================================================
    
    # Main workspace switching - Fast slide for productivity
    animation = workspaces, 1, 5, wind, slide
    
    # Individual workspace in/out (optional customization)
    animation = workspacesIn, 1, 5, wind, slide
    animation = workspacesOut, 1, 5, wind, slide
    
    # Special workspace (scratchpad) - Vertical slide
    animation = specialWorkspace, 1, 5, wind, slidevert
    animation = specialWorkspaceIn, 1, 5, wind, slidevert
    animation = specialWorkspaceOut, 1, 5, wind, slidevert
    
    # ===============================================================================
    # | LAYER ANIMATIONS (UI elements)                                             |
    # ===============================================================================
    
    # Layers general (Waybar, overlays)
    animation = layers, 1, 3, overshot, slide
    animation = layersIn, 1, 3, smoothIn, slide
    animation = layersOut, 1, 3, smoothOut, slide
    
    # ===============================================================================
    # | EXTRA ANIMATIONS (v0.51.1)                                                 |
    # ===============================================================================
    
    # Screen zoom animation (for zoom keybind)
    animation = zoomFactor, 1, 6, smoothIn
    
    # Monitor hotplug animation (no style parameter)
    animation = monitorAdded, 1, 5, smoothIn
}