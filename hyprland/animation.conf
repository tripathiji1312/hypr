# #####################################################################################
# #                                  ANIMATIONS                                       #
# #####################################################################################
#
# A cohesive and fluid animation configuration inspired by the professional setup.
# Provides an "Expressive but Fast" feel.
#

animations {
    enabled = true
    animation = monitorAdded, 1, 5, default

    # Define the curves for the animation "feel"
    bezier = smoothOut, 0.38, 1, 0.22, 1
    bezier = smoothIn, 0.4, 0, 0.6, 1
    bezier = sharp, 0.2, 0.8, 0.2, 1

    # Animation Rules
    animation = global, 1, 5, default
    
    # Windows
    animation = windowsIn, 1, 5, smoothOut, slide
    animation = windowsOut, 1, 4, smoothIn, slide
    animation = windowsMove, 1, 4, sharp, slide

    # Fades
    animation = fadeIn, 1, 5, smoothOut
    animation = fadeOut, 1, 4, smoothIn

    # Workspaces
    animation = workspaces, 1, 6, sharp, slide

    # Layers (for Waybar, Wofi, Dunst)
    animation = layers, 1, 4, sharp, fade
}