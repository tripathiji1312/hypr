# #####################################################################################
# #                                  DECORATIONS                                      #
# #####################################################################################
#
# Controls the look of window borders, gaps, shadows, and blur.
# This is a blend of your preferences and the professional config's polish.
#

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1              # Windows 11 uses very thin, subtle borders
    resize_on_border = true
    allow_tearing = false
    
    # Border colors - Subtle and clean (Windows 11 style)
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    
    # === IMPROVEMENT #2: Window Snapping ===
    # Enable smart window snapping when dragging near edges/windows
    snap {
        enabled = true
        window_gap = 10           # Snap when within 10px of another window
        monitor_gap = 10          # Snap when within 10px of monitor edge
        border_overlap = true     # Only one border's worth of space between windows
    }
    
}
group {
    groupbar {
        font_family = Segoe UI Variable Display
        font_size = 11
        text_color = 0xffffffff
        col.active = rgba(33ccffee)
        col.inactive = rgba(595959aa)
    }
}
decoration {
    # Rounding - Windows 11 uses ~10px (technically 8-12 depending on scaling)
    rounding = 10
    
    # Blur - Enhanced for "Mica" Glass Effect
    blur {
        enabled = true
        new_optimizations = true
        
        # === CRITICAL SETTINGS (DO NOT CHANGE) ===
        xray = true                  # ✅ Prevents wallpaper bleed behind floating windows
        popups = false               # ✅ Prevents PiP/popup rendering bugs (use layer rules for selective blur)
        special = false              # Don't blur special workspaces
        
        # === BLUR QUALITY & PERFORMANCE ===
        size = 6                     # Slightly smaller radius for sharper glass look
        passes = 4                   # Higher passes = premium glass effect (Mica)
        
        # === BLUR APPEARANCE TUNING ===
        noise = 0.03                 # Subtle grain
        contrast = 1.1               # Slightly higher contrast
        brightness = 0.9             # Slightly darker for depth
        vibrancy = 0.4               # Pop colors slightly
        vibrancy_darkness = 0.5      # Vibrancy strength in dark areas (0-1)
        
        # === POPUP HANDLING (LEGACY - kept false for stability) ===
        popups_ignorealpha = 0.6     # If popups were enabled, ignore pixels below this opacity
    }
    
    # Shadows - Soft, deep ambient shadows
    shadow {
        enabled = true              # drop_shadow in your config
        range = 30                  # Larger range for soft depth
        render_power = 4            # Smooth falloff
        color = rgba(0000004D)      # Softer alpha (approx 30%)
        offset = 0 4                # Downward offset
    }
    
    # Dim inactive windows
    dim_inactive = true
    dim_strength = 0.05          # Very subtle dimming
    dim_special = 0.15
    dim_around = 0.3
}

# Smart dimming exceptions
windowrule = match:class ^(mpv|vlc|celluloid)$, no_dim on  # Don't dim media players
windowrule = match:fullscreen true, no_dim on             # Don't dim fullscreen
windowrule = match:pin true, no_dim on                    # Don't dim pinned windows