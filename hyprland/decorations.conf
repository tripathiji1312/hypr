# #####################################################################################
# #                                  DECORATIONS                                      #
# #####################################################################################
#
# Controls the look of window borders, gaps, shadows, and blur.
# This is a blend of your preferences and the professional config's polish.
#

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    resize_on_border = true
    allow_tearing = false
    
    # Border colors
    col.active_border = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg  # Blue to purple
    col.inactive_border = rgba(414868ff)
    
    # === IMPROVEMENT #2: Window Snapping ===
    # Enable smart window snapping when dragging near edges/windows
    snap {
        enabled = true
        window_gap = 10           # Snap when within 10px of another window
        monitor_gap = 10          # Snap when within 10px of monitor edge
        border_overlap = true     # Only one border's worth of space between windows
    }
    
}
group {
    groupbar {
        font_family = JetBrainsMono Nerd Font
        font_size = 11
        text_color = 0xffffffff
        col.active = rgba(33ccffee)
        col.inactive = rgba(595959aa)
    }
}
decoration {
    # Rounding
    rounding = 12
    
    # Blur
    blur {
        enabled = true
        new_optimizations = true
        xray = true
        size = 6
        passes = 2
        vibrancy = 0.1696
        popups = true
    }
    
    # Shadows
    shadow {
        enabled = true
        range = 20
        render_power = 4
        color = rgba(00000044)
        offset = 0 2
    }
    
    # Dim inactive windows
    dim_inactive = true
    dim_strength = 0.1
    dim_special = 0.15
    dim_around = 0.3
}

# Smart dimming exceptions
windowrulev2 = nodim, class:^(mpv|vlc|celluloid)$  # Don't dim media players
windowrulev2 = nodim, fullscreen:1  # Don't dim fullscreen
windowrulev2 = nodim, pinned:1      # Don't dim pinned windows