# #####################################################################################
# #                                  DECORATIONS                                      #
# #####################################################################################
#
# Controls the look of window borders, gaps, shadows, and blur.
# This is a blend of your preferences and the professional config's polish.
#

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    resize_on_border = true
    allow_tearing = false
    
    # Border colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    
}
group {
    groupbar {
        font_family = JetBrainsMono Nerd Font
        font_size = 11
        text_color = 0xffffffff
        col.active = rgba(33ccffee)
        col.inactive = rgba(595959aa)
    }
}
decoration {
    # Rounding
    rounding = 12
    
    # Blur
    blur {
        enabled = true
        new_optimizations = true
        xray = false  # CRITICAL: Must be false!
        size = 6
        passes = 2
        vibrancy = 0.1696
        ignore_opacity = false  # CRITICAL: Must be false!
        popups = false  # CRITICAL: Disables blur on popups
        popups_ignorealpha = 0.8
        special = false  # Don't blur special workspaces
    }
    
    # Shadows
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000055)
        offset = 0 4
        scale = 0.97
    }
    
    # Dim inactive windows
    dim_inactive = true
    dim_strength = 0.03
    dim_special = 0.15
    dim_around = 0.3
}

# Smart dimming exceptions
windowrulev2 = nodim, class:^(mpv|vlc|celluloid)$  # Don't dim media players
windowrulev2 = nodim, fullscreen:1  # Don't dim fullscreen
windowrulev2 = nodim, pinned:1      # Don't dim pinned windows