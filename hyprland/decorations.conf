# #####################################################################################
# #                                  DECORATIONS                                      #
# #####################################################################################
#
# Controls the look of window borders, gaps, shadows, and blur.
# This is a blend of your preferences and the professional config's polish.
#

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    resize_on_border = true
    allow_tearing = false
    
    # Border colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    
}
group {
    groupbar {
        font_family = JetBrainsMono Nerd Font
        font_size = 11
        text_color = 0xffffffff
        col.active = rgba(33ccffee)
        col.inactive = rgba(595959aa)
    }
}
decoration {
    # Rounding
    rounding = 12
    
    # Blur
    blur {
        enabled = true
        new_optimizations = true
        xray = true
        size = 6
        passes = 2
        vibrancy = 0.1696
    }
    
    # Shadows
    shadow {
        enabled = true
        range = 20
        render_power = 4
        color = rgba(00000044)
        offset = 0 2
    }
    
    # Dim inactive windows
    dim_inactive = true
    dim_strength = 0.1
}