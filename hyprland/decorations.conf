# #####################################################################################
# #                                  DECORATIONS                                      #
# #####################################################################################
#
# Controls the look of window borders, gaps, shadows, and blur.
# This is a blend of your preferences and the professional config's polish.
#

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    resize_on_border = true
    allow_tearing = false
    
    # Border colors
    col.active_border = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg  # Blue to purple
    col.inactive_border = rgba(414868ff)
    
    # === IMPROVEMENT #2: Window Snapping ===
    # Enable smart window snapping when dragging near edges/windows
    snap {
        enabled = true
        window_gap = 10           # Snap when within 10px of another window
        monitor_gap = 10          # Snap when within 10px of monitor edge
        border_overlap = true     # Only one border's worth of space between windows
    }
    
}
group {
    groupbar {
        font_family = JetBrainsMono Nerd Font
        font_size = 11
        text_color = 0xffffffff
        col.active = rgba(33ccffee)
        col.inactive = rgba(595959aa)
    }
}
decoration {
    # Rounding
    rounding = 12
    
    # Blur - Enhanced for QuickShell (v0.51.1)
    blur {
        enabled = true
        new_optimizations = true
        
        # === CRITICAL SETTINGS (DO NOT CHANGE) ===
        xray = true                  # ✅ Prevents wallpaper bleed behind floating windows
        popups = false               # ✅ Prevents PiP/popup rendering bugs (use layer rules for selective blur)
        special = false              # Don't blur special workspaces
        
        # === BLUR QUALITY & PERFORMANCE ===
        size = 8                     # Blur radius (increased from 6 for smoother effect)
        passes = 3                   # More passes = smoother but slower (increased from 2)
        
        # === BLUR APPEARANCE TUNING ===
        noise = 0.02                 # Adds subtle texture (0-1) - prevents flat appearance
        contrast = 1.0               # Contrast modulation (0-2) - 1.0 is neutral
        brightness = 1.0             # Brightness modulation (0-2) - 1.0 is neutral
        vibrancy = 0.2               # Color saturation boost (0-1) - increased from 0.1696
        vibrancy_darkness = 0.5      # Vibrancy strength in dark areas (0-1)
        
        # === POPUP HANDLING (LEGACY - kept false for stability) ===
        popups_ignorealpha = 0.6     # If popups were enabled, ignore pixels below this opacity
    }
    
    # Shadows - Enhanced for QuickShell
    shadow {
        enabled = true              # drop_shadow in your config
        range = 20                  # shadow_range
        render_power = 3            # shadow_render_power (reduced from 4 for softer shadows)
        color = rgba(00000066)      # col.shadow (increased alpha for visibility)
        offset = 0 2                # Slight downward offset for depth
    }
    
    # Dim inactive windows
    dim_inactive = true
    dim_strength = 0.1
    dim_special = 0.15
    dim_around = 0.3
}

# Smart dimming exceptions
windowrulev2 = nodim, class:^(mpv|vlc|celluloid)$  # Don't dim media players
windowrulev2 = nodim, fullscreen:1  # Don't dim fullscreen
windowrulev2 = nodim, pinned:1      # Don't dim pinned windows