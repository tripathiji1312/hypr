windowrule = match:title ^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$, move (monitor_w*0.74) (monitor_h*0.73)
windowrule = match:title ^(Meet - [a-z]{3}-[a-z]{4}-[a-z]{3})$, border_size 0
