# =======================================================================================
# Creates a cleaner experience when focusing on a single window.
# Note: The 's[false]' excludes special workspaces from this behavior.

# --- Workspace-level: Remove gaps and disable borders/rounding
workspace = w[tv1]s[false], gapsout:0, gapsin:0, border:false, rounding:false
workspace = f[1]s[false], gapsout:0, gapsin:0, border:false, rounding:false

# --- Window-level: Remove borders and rounding for tiled windows
windowrule = match:float false, match:workspace w[tv1]s[false], border_size 0
windowrule = match:float false, match:workspace w[tv1]s[false], rounding 0
windowrule = match:float false, match:workspace f[1]s[false], border_size 0
windowrule = match:float false, match:workspace f[1]s[false], rounding 0


# =======================================================================================
# | VI. LAYER RULES - BARS, NOTIFICATIONS, LAUNCHERS                                   |
# =======================================================================================
# Control blur and behavior for overlay surfaces (status bars, notifications, etc.)
# Find layer namespaces with: hyprctl layers

# --- Status Bar (Waybar)
layerrule = match:namespace waybar, blur on
layerrule = match:namespace gtk-layer-shell, blur on
layerrule = match:namespace waybar, ignore_alpha 0  # Ignore fully transparent pixels in blur
layerrule = match:namespace waybar, xray 1          # Modern blur-through effect

# --- Notification Daemon
layerrule = match:namespace notifications, blur on
layerrule = match:namespace notifications, ignore_alpha 0.3  # Don't blur if opacity < 0.3

# --- App Launchers
layerrule = match:namespace wofi, blur on
layerrule = match:namespace rofi, blur on
layerrule = match:namespace wofi, ignore_alpha 0.5
layerrule = match:namespace wofi, animation popin
layerrule = match:namespace rofi, animation popin

# --- Lock Screen
layerrule = match:namespace hyprlock, blur on
layerrule = match:namespace hyprlock, no_anim on
layerrule = match:namespace hyprlock, above_lock 1

# --- Quickshell Components (Enhanced Blur)
# Blur specific QuickShell panels (more precise control than global popups blur)
layerrule = match:namespace quickshell-controlcenter, blur on
layerrule = match:namespace quickshell-bar, blur on
layerrule = match:namespace quickshell-notifications, blur on
layerrule = match:namespace quickshell-controlcenter, ignore_alpha 0.6  # Don't blur if opacity < 60%
layerrule = match:namespace quickshell-bar, ignore_alpha 0.6
layerrule = match:namespace quickshell-notifications, ignore_alpha 0.6
# Generic fallback for any QuickShell layer
layerrule = match:namespace ^(quickshell.*)$, no_anim on


# --- module: helpers ---
# =======================================================================================
# | AUDIO FEEDBACK HELPERS                                                             |
# =======================================================================================
# Audio feedback provides immediate sensory confirmation of keybind actions
# Requires: canberra-gtk-play (usually pre-installed on Linux desktops)
# 
# To add beep feedback to any keybind, append to the bind command:
# Example: bind = $mainMod, X, exec, ~/.config/hypr/scripts/action.sh && canberra-gtk-play -i system-ready
# 
# Available system sounds (canberra names):
#   system-shutdown  - Logout/shutdown sound
#   system-ready     - System ready/startup sound
#   dialog-warning   - Warning notification
#   dialog-error     - Error notification
#   dialog-information - Information notification
#   complete-action  - Task complete sound
# 
# Note: For workspace changes, add beep to keybinds like this:
# bind = $mainMod, 1, workspace, 1; exec, canberra-gtk-play -i system-ready
#

# --- module: keybinds ---
# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Define variables for applications
$terminal = kitty
$fileManager = nautilus

# =======================================================================================
# | SCRATCHPAD SYSTEM (Special Workspace)                                               |
# =======================================================================================

# Super + S: Toggle scratchpad terminal
bind = $mainMod, S, togglespecialworkspace, term
bind = $mainMod SHIFT, S, movetoworkspace, special:term

# Super + Shift + M: Toggle music scratchpad
bind = $mainMod SHIFT, M, togglespecialworkspace, music
bind = $mainMod CTRL SHIFT, M, movetoworkspace, special:music

# Super + Shift + E: Toggle file manager scratchpad
bind = $mainMod SHIFT, E, togglespecialworkspace, files
bind = $mainMod CTRL SHIFT, E, movetoworkspace, special:files

# =======================================================================================
# | SCRATCHPAD MOVEMENT (Move windows to workspaces with auto-close)                   |
# =======================================================================================

# Super + Ctrl + [1-9]: Move active window to workspace + close scratchpad
bind = $mainMod CTRL, 1, exec, ~/.config/hypr/scripts/toggle_scratchpad.sh move 1
bind = $mainMod CTRL, 2, exec, ~/.config/hypr/scripts/toggle_scratchpad.sh move 2
bind = $mainMod CTRL, 3, exec, ~/.config/hypr/scripts/toggle_scratchpad.sh move 3
bind = $mainMod CTRL, 4, exec, ~/.config/hypr/scripts/toggle_scratchpad.sh move 4
bind = $mainMod CTRL, 5, exec, ~/.config/hypr/scripts/toggle_scratchpad.sh move 5
bind = $mainMod CTRL, 6, exec, ~/.config/hypr/scripts/toggle_scratchpad.sh move 6
bind = $mainMod CTRL, 7, exec, ~/.config/hypr/scripts/toggle_scratchpad.sh move 7
bind = $mainMod CTRL, 8, exec, ~/.config/hypr/scripts/toggle_scratchpad.sh move 8
bind = $mainMod CTRL, 9, exec, ~/.config/hypr/scripts/toggle_scratchpad.sh move 9

# =======================================================================================
# | WINDOW GROUPS                                                                      |
# =======================================================================================

# Super + G: Toggle between window groups
bind = $mainMod, G, togglegroup

# Super + [ / ]: Navigate group windows
bind = $mainMod, bracketleft, changegroupactive, b
bind = $mainMod, bracketright, changegroupactive, f

# =======================================================================================
# | CUSTOM KEYBINDS                                                                    |
# =======================================================================================

# Super + W: Change wallpaper and theme instantly
bind = $mainMod, W, exec, ~/.config/hypr/scripts/change_wallpaper_once.sh

# Super + N: Open network manager menu
bind = $mainMod, N, exec, ~/.config/hypr/scripts/wofi_network.sh

# Super + Shift + C: Fix cursor theme (useful after system updates)
bind = $mainMod SHIFT, C, exec, ~/.config/hypr/scripts/fix_cursor.sh

# =======================================================================================
# | DYNAMIC CONFIG TOGGLES (Hyprland 0.55+)                                            |
# =======================================================================================

# Super + Shift + G: Toggle gaps (Focus Mode)
bind = $mainMod SHIFT, G, exec, hyprctl eval 'local gaps = hl.get_config("general.gaps_in"); if gaps.top == 0 then hl.config({ general = { gaps_in = 4, gaps_out = 8 } }); hl.notification.create({ text = "🔲 Gaps ON", duration = 2000, icon = "ok" }) else hl.config({ general = { gaps_in = 0, gaps_out = 0 } }); hl.notification.create({ text = "⬛ Gaps OFF (Focus Mode)", duration = 2000, icon = "ok" }) end'

# Super + Shift + B: Toggle blur
bind = $mainMod SHIFT, B, exec, hyprctl eval 'local blur = hl.get_config("decoration.blur.enabled"); hl.config({ decoration = { blur = { enabled = not blur } } }); local state = blur and "OFF ⚡" or "ON ✨"; hl.notification.create({ text = "Blur " .. state, duration = 2000, icon = "info" })'


# =======================================================================================
# | CLIPBOARD MANAGER                                                                  |
# =======================================================================================

# Super + H: Open clipboard history (wofi)
bind = $mainMod, H, exec, ~/.config/hypr/scripts/wofi_clipboard.sh

# Super + Shift + H: Clear clipboard history
bind = $mainMod SHIFT, H, exec, cliphist wipe && notify-send "Clipboard" "History cleared"

# =======================================================================================
# | SCREENSHOTS                                                                        |
# =======================================================================================

# PrintScreen: Open screenshot menu
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh

# Shift + PrintScreen: Capture a region and copy to clipboard
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Region copied to clipboard"

# Ctrl + Print: Screenshot current window
bind = CTRL, Print, exec, grim -g "$(hyprctl -j activewindow | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | wl-copy

# Alt + Print: 5-second countdown screenshot
bind = ALT, Print, exec, notify-send "Screenshot in 5s..." && sleep 5 && grim ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png

# =======================================================================================
# | APPLICATIONS                                                                       |
# =======================================================================================

# Super + Return: Launch terminal
bind = $mainMod, Return, exec, $terminal

# Super + E: Launch file manager
bind = $mainMod, E, exec, $fileManager

# Super + B: Launch browser
# Super + B: Launch Zen Browser (with Wayland flags to fix black borders)
bind = $mainMod, B, exec, vivaldi-stable

# Super + C: Launch VS Code
bind = $mainMod, C, exec, code

# Super + D: Launch Discord
# bind = $mainMod, D, exec, discord
# Control Center toggle (SUPER + D)
bind = SUPER, D, exec, ~/.config/quickshell/toggle-control-center.sh

# Super key (alone): Open/close wofi launcher
bind = SUPER, SUPER_L, exec, pkill wofi || wofi --show drun

# =======================================================================================
# | WINDOW MANAGEMENT                                                                  |
# =======================================================================================

# Super + Q: Close active window
bind = $mainMod, Q, killactive

# Super + Shift + Q: Force kill window
bind = $mainMod SHIFT, Q, exec, hyprctl kill

# Super + V: Toggle floating for active window
bind = $mainMod, V, togglefloating

# Super + T: Center floating window
bind = $mainMod, T, centerwindow

# Super + I: Pin window (keep on top)
bind = $mainMod, I, pin

# Super + O: Toggle window opacity (opaque/transparent)
bind = $mainMod, O, exec, hyprctl setprop active opaque toggle

# Super + Shift + O: Open opacity picker (slider)
bind = $mainMod SHIFT, O, exec, ~/.config/hypr/scripts/opacity_picker.sh

# Super + P: Restart Waybar
bind = $mainMod, P, exec, killall quickshell || quickshell

# Super + Shift + P: Toggle pseudo-tiling
bind = $mainMod SHIFT, P, pseudo

# Super + J: Toggle split direction
bind = $mainMod, J, layoutmsg, togglesplit

# Latest layouts: toggle scrolling layout without replacing your dwindle default
bind = $mainMod CTRL, period, exec, ~/.config/hypr/scripts/toggle_layout_mode.sh

# Cursor zoom helpers for the new v0.54 zoom pipeline
bind = $mainMod CTRL, equal, exec, ~/.config/hypr/scripts/cursor_zoom.sh in
bind = $mainMod CTRL, minus, exec, ~/.config/hypr/scripts/cursor_zoom.sh out
bind = $mainMod CTRL, 0, exec, ~/.config/hypr/scripts/cursor_zoom.sh reset

# Scrolling layout controls (active only when general:layout = scrolling)
bind = $mainMod ALT, comma, layoutmsg, move -col
bind = $mainMod ALT, period, layoutmsg, move +col
bind = $mainMod ALT SHIFT, comma, layoutmsg, swapcol l
bind = $mainMod ALT SHIFT, period, layoutmsg, swapcol r
bind = $mainMod ALT, slash, layoutmsg, togglefit
bind = $mainMod ALT, minus, layoutmsg, colresize -conf
bind = $mainMod ALT, equal, layoutmsg, colresize +conf
bind = $mainMod ALT SHIFT, Return, layoutmsg, promote
bind = $mainMod CTRL ALT, slash, layoutmsg, fit active
bind = $mainMod CTRL ALT, backslash, layoutmsg, fit all
bind = $mainMod CTRL, P, layoutmsg, promote
bind = $mainMod CTRL, G, exec, hyprctl --batch "dispatch movewindow l ; dispatch movewindow d"
bind = $mainMod CTRL SHIFT, G, exec, hyprctl --batch "dispatch movewindow u ; dispatch movewindow r"

# Fullscreen Toggles
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, F, fullscreen, 1

# Window Cycling
bind = ALT, Tab, cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev

# Resize windows
bind = $mainMod CTRL, left, resizeactive, -20 0
bind = $mainMod CTRL, right, resizeactive, 20 0
bind = $mainMod CTRL, up, resizeactive, 0 -20
bind = $mainMod CTRL, down, resizeactive, 0 20

# Swap windows
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

# =======================================================================================
# | WORKSPACE NAVIGATION                                                               |
# =======================================================================================

# Super + [1-9, 0]: Switch to workspace 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Super + Shift + [1-9, 0]: Move window and follow to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Super + Alt + [1-9, 0]: Move window silently (don't follow)
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10

# Super + Tab: Next occupied workspace
bind = $mainMod, TAB, workspace, m+1
bind = $mainMod SHIFT, TAB, workspace, m-1

# Super + Alt + Right/Left: Navigate all workspaces
bind = $mainMod ALT, right, workspace, e+1
bind = $mainMod ALT, left, workspace, e-1

# Super + Mouse Wheel: Scroll through workspaces
