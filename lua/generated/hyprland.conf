bindel = , XF86AudioLowerVolume, exec, /home/tripathiji/.config/hypr/scripts/change_volume_brightness_osd.sh volume_down
bindl = , XF86AudioMute, exec, /home/tripathiji/.config/hypr/scripts/change_volume_brightness_osd.sh volume_mute

